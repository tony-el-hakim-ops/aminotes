name: aminotes_example
description: "Example app for the aminotes package: a note box that expands to full screen."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  aminotes:
    path: ../
  flutter_localizations:
    sdk: flutter
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Generated by `npm run normalize` in ../tiptap/.
    - assets/sample_note.json
    - assets/fonts/Caveat-OFL.txt
  # A handwriting font (SIL Open Font License) for the playground's sticky
  # note: shows AminotesTheme.fonts with a font bundled in the app.
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
